<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Week Personality Quiz</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --accent-color: #0d6efd;
      --accent-hover: #0b5ed7;
      --border-color: #e9ecef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #app-container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 650px;
      width: 100%;
      padding: 32px;
      box-sizing: border-box;
    }

    /* Progress Bar */
    #progress {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6c757d;
      margin-bottom: 12px;
    }

    /* Question Typography */
    #question-text {
      font-size: 1.25rem;
      line-height: 1.5;
      margin-top: 0;
      margin-bottom: 24px;
    }

    /* Option Buttons */
    #options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #f1f3f5;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-size: 1rem;
      line-height: 1.4;
      text-align: left;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .option-btn:hover {
      background-color: #e9ecef;
      border-color: #ced4da;
      transform: translateY(-1px);
    }

    /* Results Section Styling */
    #results-container h1 {
      font-size: 1.75rem;
      margin-top: 0;
      margin-bottom: 8px;
      color: var(--accent-color);
    }

    #result-vibe {
      font-size: 1.1rem;
      font-style: italic;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 20px;
      color: #495057;
    }

    #result-description {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .result-details {
      background-color: #f8f9fa;
      border-left: 4px solid var(--accent-color);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 28px;
    }

    .result-details p {
      margin: 8px 0;
      line-height: 1.5;
    }

    #restart-btn {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease-in-out;
    }

    #restart-btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <main id="app-container">
    <!-- Active Quiz View -->
    <section id="quiz-container">
      <div id="progress">
        Question <span id="current-q-num">1</span> of <span id="total-q-num">9</span>
      </div>
      <h2 id="question-text">Loading question...</h2>
      <div id="options-container"></div>
    </section>

    <!-- Hidden Results View -->
    <section id="results-container" style="display: none;">
      <h1 id="result-title"></h1>
      <p id="result-vibe"></p>
      
      <p id="result-description"></p>

      <div class="result-details">
        <p><strong>Biggest Strength:</strong> <span id="result-strength"></span></p>
        <p><strong>Biggest Weakness:</strong> <span id="result-weakness"></span></p>
        <p><strong>Motto:</strong> <span id="result-motto"></span></p>
      </div>

      <button id="restart-btn" onclick="restartQuiz()">Retake Quiz</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
