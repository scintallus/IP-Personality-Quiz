<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Quiz</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-xl bg-slate-800 border border-slate-700/60 rounded-2xl shadow-2xl p-6 sm:p-10 relative overflow-hidden">
        
        <!-- Welcome Screen -->
        <section id="welcome-screen" class="text-center space-y-6 fade-in">
            <span id="quiz-tag" class="text-xs font-semibold tracking-widest text-indigo-400 uppercase bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">Discovery Assessment</span>
            <h1 id="quiz-title" class="text-3xl sm:text-4xl font-bold tracking-tight text-white mt-2">Loading Quiz...</h1>
            <p id="quiz-desc" class="text-slate-400 text-sm sm:text-base max-w-md mx-auto leading-relaxed"></p>
            <button id="start-btn" onclick="startQuiz()" class="hidden w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-8 py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-[0.98]">
                Begin Quiz
            </button>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="hidden space-y-6">
            <!-- Progress Bar -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs font-medium text-slate-400">
                    <span id="question-indicator">Question 1</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-300 ease-out"></div>
                </div>
            </div>

            <!-- Question Card -->
            <div id="question-card" class="fade-in space-y-6 pt-2">
                <h2 id="question-text" class="text-xl sm:text-2xl font-semibold text-white leading-snug"></h2>
                <div id="options-container" class="space-y-3"></div>
            </div>
        </section>

        <!-- Results Screen -->
        <section id="result-screen" class="hidden text-center space-y-6 fade-in">
            <span class="text-xs font-semibold tracking-widest text-emerald-400 uppercase bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">Your Match Result</span>
            <h2 id="result-title" class="text-3xl sm:text-4xl font-bold text-white"></h2>
            <p id="result-desc" class="text-slate-300 text-sm sm:text-base leading-relaxed bg-slate-900/50 p-5 rounded-xl border border-slate-700/50 text-left"></p>
            
            <button onclick="restartQuiz()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition-all duration-200">
                Retake Quiz
            </button>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
